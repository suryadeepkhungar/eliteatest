name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - add-client-work-test_v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          npm test
